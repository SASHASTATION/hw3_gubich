# HW3 overlay for HW1: Kafka -> scorer -> scores -> PostgreSQL -> Streamlit.
# Airflow uses its own metadata DB; fraud_db contains labeled showcase and score results.
x-airflow-common: &airflow-common
  build:
    context: ./airflow
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'false'
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: '10'
    PYTHONPATH: /opt/airflow:/opt/airflow/hw1/scoring_service
    POSTGRES_HOST: postgres
    POSTGRES_PORT: '5432'
    POSTGRES_DB: fraud_db
    POSTGRES_USER: fraud_user
    POSTGRES_PASSWORD: fraud_password
    ARTIFACTS_DIR: /artifacts
    BASELINE_MODEL_PATH: /opt/airflow/hw1/scoring_service/models/model.json
    WINDOW_MONTHS: '3'
    HISTORY_MONTHS: '36'
    SUPPLY_BATCH_SIZE: '1000'
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./pipeline:/opt/airflow/pipeline:ro
    - ./hw1/scoring_service:/opt/airflow/hw1/scoring_service:ro
    - ./artifacts:/artifacts
    - airflow_logs:/opt/airflow/logs
  networks: [fraud-net]

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks: [fraud-net]

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    depends_on: [zookeeper]
    ports: ["9095:9095"]
    environment:
      KAFKA_BROKER_ID: '1'
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 8s
      timeout: 5s
      retries: 25
    networks: [fraud-net]

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    depends_on:
      kafka: {condition: service_healthy}
    ports: ["8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks: [fraud-net]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fraud_db
      POSTGRES_USER: fraud_user
      POSTGRES_PASSWORD: fraud_password
    ports: ["5433:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./hw1/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud_user -d fraud_db"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [fraud-net]

  db-migrate:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: fraud_password
    entrypoint: ["psql"]
    command: ["-v", "ON_ERROR_STOP=1", "-h", "postgres", "-U", "fraud_user", "-d", "fraud_db", "-f", "/migrations/001_hw3.sql"]
    volumes:
      - ./db/migrations:/migrations:ro
    depends_on:
      postgres: {condition: service_healthy}
    restart: 'no'
    networks: [fraud-net]

  artifacts-init:
    image: alpine:3.20
    user: "0:0"
    command: ["sh", "-ec", "mkdir -p /artifacts/models /artifacts/reports /artifacts/work && chmod -R a+rwX /artifacts"]
    volumes: ["./artifacts:/artifacts"]
    restart: 'no'
    networks: [fraud-net]

  scoring-service:
    build:
      context: .
      dockerfile: scoring_service/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TRANSACTIONS_TOPIC: transactions
      KAFKA_SCORES_TOPIC: scores
      MODEL_PATH: /app/models/model.json
      MODEL_DIR: /models
      HEALTH_PORT: '8001'
    volumes:
      - ./artifacts/models:/models:ro
    depends_on:
      kafka: {condition: service_healthy}
      artifacts-init: {condition: service_completed_successfully}
    ports: ["8001:8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 8s
    restart: unless-stopped
    networks: [fraud-net]

  results-writer:
    build:
      context: .
      dockerfile: results_writer/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_SCORES_TOPIC: scores
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_DB: fraud_db
      POSTGRES_USER: fraud_user
      POSTGRES_PASSWORD: fraud_password
      HEALTH_PORT: '8002'
    depends_on:
      kafka: {condition: service_healthy}
      db-migrate: {condition: service_completed_successfully}
    ports: ["8002:8002"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 8s
    restart: unless-stopped
    networks: [fraud-net]

  interface:
    build: ./hw1/interface
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TRANSACTIONS_TOPIC: transactions
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_DB: fraud_db
      POSTGRES_USER: fraud_user
      POSTGRES_PASSWORD: fraud_password
      SCORING_HEALTH_URL: http://scoring-service:8001/health
      WRITER_HEALTH_URL: http://results-writer:8002/health
    depends_on:
      kafka: {condition: service_healthy}
      db-migrate: {condition: service_completed_successfully}
      scoring-service: {condition: service_healthy}
      results-writer: {condition: service_healthy}
    ports: ["8501:8501"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks: [fraud-net]

  smoke-test:
    build: ./hw1/smoke_test
    profiles: ["tools"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TRANSACTIONS_TOPIC: transactions
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_DB: fraud_db
      POSTGRES_USER: fraud_user
      POSTGRES_PASSWORD: fraud_password
    depends_on:
      kafka: {condition: service_healthy}
      db-migrate: {condition: service_completed_successfully}
      scoring-service: {condition: service_healthy}
      results-writer: {condition: service_healthy}
    networks: [fraud-net]

  airflow-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [fraud-net]

  airflow-init:
    <<: *airflow-common
    command:
      - bash
      - -ec
      - |
        airflow db migrate
        airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true
        python -m pipeline.bootstrap
    depends_on:
      airflow-postgres: {condition: service_healthy}
      db-migrate: {condition: service_completed_successfully}
      artifacts-init: {condition: service_completed_successfully}
    restart: 'no'

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports: ["8081:8080"]
    depends_on:
      airflow-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 45s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init: {condition: service_completed_successfully}
    restart: unless-stopped

networks:
  fraud-net:
    driver: bridge

volumes:
  postgres_data:
  airflow_postgres_data:
  airflow_logs:
